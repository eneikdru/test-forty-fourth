openapi: 3.0.3
info:
  title: EpiTrack Materials Management API Contract
  description: Shared API contract for material CRUD operations (Create, Read, Update, Delete) to enable parallel frontend and backend development.
  version: 1.0.0
paths:
  /api/materials:
    post:
      summary: Create a new epidemiological material
      description: Adds a new material to the catalog with category assignment and validation status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialRequest'
      responses:
        '201':
          description: Material successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDTO'
        '400':
          description: Bad request due to validation errors (e.g., missing title or invalid status).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/materials/{id}:
    get:
      summary: Retrieve a material by its unique identifier
      description: Returns the full details of a specific epidemiological material.
      parameters:
        - name: id
          in: path
          description: Unique identifier of the material.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Material successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDTO'
        '404':
          description: Material not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing epidemiological material
      description: Modifies the details of a specific material. Supports partial/full updates.
      parameters:
        - name: id
          in: path
          description: Unique identifier of the material to be updated.
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaterialRequest'
      responses:
        '200':
          description: Material successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDTO'
        '400':
          description: Bad request due to validation errors (e.g., invalid status enum).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Material not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete an epidemiological material
      description: Permanently removes a material from the catalog.
      parameters:
        - name: id
          in: path
          description: Unique identifier of the material to be deleted.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Material successfully deleted. No content returned.
        '404':
          description: Material not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    MaterialDTO:
      type: object
      required:
        - id
        - title
        - content
        - updated_at
        - category
        - status
      properties:
        id:
          type: integer
          format: int64
          description: Unique identifier of the material.
          example: 1
        title:
          type: string
          description: Title of the epidemiological material.
          example: "Influenza A(H1N1) Surveillance Protocol v3.2"
        content:
          type: string
          description: Comprehensive content or description.
          example: "Standard operating procedure for the detection, reporting, and preliminary epidemiological investigation of suspected human cases..."
        category:
          type: string
          description: Category classification of the material.
          example: "Viral Strains"
        status:
          type: string
          description: Current lifecycle or validation status.
          enum: [Analyzed, Pending, Archived, Urgent]
          example: "Analyzed"
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update.
          example: "2023-10-12T00:00:00Z"

    CreateMaterialRequest:
      type: object
      required:
        - title
        - content
        - category
        - status
      properties:
        title:
          type: string
          description: Title of the material.
          example: "Influenza A(H1N1) Surveillance Protocol v3.2"
        content:
          type: string
          description: Detailed content or description.
          example: "Standard operating procedure for the detection, reporting, and preliminary epidemiological investigation of suspected human cases..."
        category:
          type: string
          description: Category classification of the material.
          example: "Viral Strains"
        status:
          type: string
          description: Validation or review status.
          enum: [Analyzed, Pending, Archived, Urgent]
          example: "Pending"

    UpdateMaterialRequest:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the material.
          example: "Influenza A(H1N1) Surveillance Protocol v3.3"
        content:
          type: string
          description: Updated detailed content.
          example: "Revised standard operating procedure for the detection, reporting..."
        category:
          type: string
          description: Updated category classification.
          example: "Viral Strains"
        status:
          type: string
          description: Updated validation or review status.
          enum: [Analyzed, Pending, Archived, Urgent]
          example: "Analyzed"

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Canonical error code.
          example: "NOT_FOUND"
        message:
          type: string
          description: Detailed human-readable error message.
          example: "Material with ID 1 does not exist"
        timestamp:
          type: string
          format: date-time
          description: ISO timestamp of the error event.
          example: "2026-08-12T16:38:26Z"
